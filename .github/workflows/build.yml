name: Build Plugin

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform 34
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create Gradle Wrapper
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 8.11.1
            chmod +x ./gradlew
          fi

      - name: Build plugin
        run: |
          chmod +x ./gradlew || true
          ./gradlew :main:assembleRelease --stacktrace --no-daemon

      - name: Upload .acp artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: BuildGenius-acp
          path: |
            main/build/*.acp
            BuildGenius.acp
            main/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build reports on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-reports
          path: |
            main/build/reports/**
            **/build/outputs/**
          if-no-files-found: ignore
          retention-days: 7
